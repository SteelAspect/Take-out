// Fabric dedicated-server companion: answers shulker retrieval requests (takeitout:getstack) from
// Container Auto Fill clients. Needs only Fabric API. Not needed in singleplayer/LAN.
plugins {
    id 'fabric-loom'
}

version = rootProject.mod_version
group = rootProject.maven_group

base {
    archivesName = 'containerautofill-server'
}

sourceSets {
    main {
        java {
            // Share the protocol and server handler with the client mod so both stay identical.
            srcDir rootProject.file('src/main/java')
            include 'dev/steelaspect/containerautofill/server/**'
            include 'dev/steelaspect/containerautofill/takeitout/GetStackPayload.java'
            include 'dev/steelaspect/containerautofill/takeitout/ShulkerStackServerHandler.java'
            include 'dev/steelaspect/containerautofill/takeitout/ShulkerUtil.java'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings "net.fabricmc:yarn:${rootProject.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"
}

processResources {
    def props = [version: project.version, minecraft_version: rootProject.minecraft_version, loader_version: rootProject.loader_version]
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
    it.options.compilerArgs << '-Xlint:deprecation' << '-Xlint:unchecked'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

loom {
    runs {
        server {
            runDir = 'run'
        }
    }
}

jar {
    def archiveSuffix = base.archivesName.get()
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${archiveSuffix}" }
    }
    from(rootProject.file('COPYING.GPL')) {
        rename { "${it}_${archiveSuffix}" }
    }
}
