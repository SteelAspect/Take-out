plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'com.modrinth.minotaur' version '2.10.0'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Litematica and MaLiLib are only published to Modrinth for 1.21.11.
    exclusiveContent {
        forRepository {
            maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // -PwithoutLitematica keeps Litematica off the runtime classpath, to check the client-side
    // missing-Litematica message (TESTING.md D2). Normal builds always use modImplementation.
    if (project.hasProperty('withoutLitematica')) {
        modCompileOnly "maven.modrinth:litematica:${project.litematica_modrinth_id}"
    } else {
        modImplementation "maven.modrinth:litematica:${project.litematica_modrinth_id}"
    }
    modImplementation "maven.modrinth:malilib:${project.malilib_modrinth_id}"
    // Litematica Printer (CC0) in dev/test runs only, for the printer pull hook. Never bundled or required.
    // -PwithoutPrinter leaves it out, to check the game still starts without it.
    if (!project.hasProperty('withoutPrinter')) {
        modLocalRuntime "maven.modrinth:litematica-printer:${project.printer_modrinth_id}"
    }
}

// MaLiLib ships conditional-mixin as a jar-in-jar. Loom doesn't unpack nested jars of Maven mods for
// dev runs, so MaLiLib's own copy is extracted onto the local runtime classpath (runClient / tests only;
// never part of this mod's jar or metadata).
configurations {
    malilibArtifact { transitive = false }
}
dependencies {
    malilibArtifact "maven.modrinth:malilib:${project.malilib_modrinth_id}"
}
def malilibNestedJar = layout.buildDirectory.file('malilib-nested/conditional-mixin-fabric.jar').get().asFile
if (!malilibNestedJar.exists()) {
    new java.util.zip.ZipFile(configurations.malilibArtifact.singleFile).withCloseable { zip ->
        def entry = zip.entries().find { it.name.startsWith('META-INF/jars/conditional-mixin') }
        if (entry != null) {
            malilibNestedJar.parentFile.mkdirs()
            malilibNestedJar.bytes = zip.getInputStream(entry).bytes
        }
    }
}
dependencies {
    if (malilibNestedJar.exists()) {
        modLocalRuntime files(malilibNestedJar)
    }
}

// In-game client tests (src/gametest), run with ./gradlew runClientGameTest. Not part of the mod jar.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'containerautofill-test'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
        clearRunDirectory = true
    }
}

// The storage query handler answers from inside its packet handler, which the client game test network
// synchronizer doesn't support; Fabric's documented switch for that case (test runs only).
loom {
    runs.matching { it.name == 'clientGameTest' }.configureEach {
        vmArg '-Dfabric.client.gametest.disableNetworkSynchronizer=true'
    }
}

processResources {
    def props = [
            version          : project.version,
            minecraft_version: project.minecraft_version,
            loader_version   : project.loader_version,
            litematica_version: project.litematica_version,
            malilib_version  : project.malilib_version
    ]
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
    it.options.compilerArgs << '-Xlint:deprecation' << '-Xlint:unchecked'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

jar {
    def archiveSuffix = project.base.archivesName.get()
    from('LICENSE') {
        rename { "${it}_${archiveSuffix}" }
    }
    from('COPYING.GPL') {
        rename { "${it}_${archiveSuffix}" }
    }
}

// Modrinth upload: `./gradlew modrinth` with the MODRINTH_TOKEN environment variable set (a Modrinth token with the
// CREATE_VERSION scope). Changelog text comes from -Pchangelog="..."; add -PmodrinthDryRun to print the upload
// without sending it. Fails if this version number is already on Modrinth.
modrinth {
    projectId = project.modrinth_project
    versionNumber = project.mod_version
    versionName = "Cytra Container ${project.mod_version}"
    uploadFile = remapJar
    gameVersions = [project.minecraft_version]
    loaders = ['fabric']
    changelog = project.findProperty('changelog') ?: "Cytra Container ${project.mod_version}"
    debugMode = project.hasProperty('modrinthDryRun')
    dependencies {
        required.project 'fabric-api'
        // Client-side only: needed for the schematic container fill, not for shulker pulling.
        optional.project 'litematica'
        optional.project 'malilib'
    }
}
